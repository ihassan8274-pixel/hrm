<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-label="مِزْهار | MIZHAR">
  <title>مِزْهار | MIZHAR</title>
  <defs>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12825F"/>
      <stop offset="1" stop-color="#0B513C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9AE6A"/>
      <stop offset="1" stop-color="#A9762E"/>
    </linearGradient>
  </defs>

  <!-- Emblem: a balance whose beam and pans bloom into leaves -->
  <g transform="translate(650 130)">
    <circle cx="0" cy="0" r="96" fill="#EAF5F0" opacity="0.85"/>
    <circle cx="0" cy="0" r="96" fill="none" stroke="#0F6B4F" stroke-opacity="0.18" stroke-width="2"/>

    <!-- scale beam -->
    <path d="M -58 -24 Q 0 -44 58 -24" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
    <!-- suspensions -->
    <path d="M -58 -22 L -58 -4 M 58 -22 L 58 -4" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- leaf pans -->
    <path d="M -58 -6 C -82 -2 -82 30 -58 34 C -34 30 -34 -2 -58 -6 Z" fill="url(#emerald)"/>
    <path d="M 58 -6 C 34 -2 34 30 58 34 C 82 30 82 -2 58 -6 Z" fill="url(#emerald)"/>
    <path d="M -58 0 L -58 27 M 58 0 L 58 27" stroke="#EAF5F0" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <!-- central stem / pillar -->
    <path d="M 0 58 L 0 -34" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="0" cy="60" rx="30" ry="7" fill="url(#emerald)"/>
    <!-- blooming bud -->
    <path d="M 0 -76 C 18 -66 18 -46 0 -38 C -18 -46 -18 -66 0 -76 Z" fill="url(#gold)"/>
    <path d="M 0 -70 L 0 -43" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <!-- side sprouts -->
    <path d="M 0 -10 C -18 -16 -26 -8 -28 2 C -16 4 -6 -2 0 -10 Z" fill="#12825F" opacity="0.9"/>
    <path d="M 0 -10 C 18 -16 26 -8 28 2 C 16 4 6 -2 0 -10 Z" fill="#12825F" opacity="0.9"/>
  </g>

  <!-- Wordmark -->
  <text x="350" y="112" text-anchor="middle" direction="rtl" font-family="Tahoma, 'Segoe UI', Arial, sans-serif" font-size="62" font-weight="900" fill="#0B513C">مِزْهار</text>
  <path d="M 250 132 H 450" stroke="url(#gold)" stroke-width="2" opacity="0.6"/>
  <text x="350" y="173" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" letter-spacing="7" fill="#B8873C">MIZHAR</text>
  <text x="350" y="210" text-anchor="middle" direction="rtl" font-family="Tahoma, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#5F716A">الموارد البشرية · الرواتب · الامتثال</text>
</svg>
