<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="MIZHAR app icon">
  <title>MIZHAR app icon</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12825F"/>
      <stop offset="1" stop-color="#0B513C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0D19A"/>
      <stop offset="1" stop-color="#B8873C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="8" y="8" width="1008" height="1008" rx="228" fill="url(#bg)"/>
  <rect x="8" y="8" width="1008" height="1008" rx="228" fill="url(#glow)"/>
  <rect x="8" y="8" width="1008" height="1008" rx="228" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="6"/>

  <g transform="translate(512 516) scale(4.15)">
    <!-- balance beam -->
    <path d="M -58 -24 Q 0 -44 58 -24" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
    <path d="M -58 -22 L -58 -4 M 58 -22 L 58 -4" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- leaf pans -->
    <path d="M -58 -6 C -82 -2 -82 30 -58 34 C -34 30 -34 -2 -58 -6 Z" fill="#ffffff"/>
    <path d="M 58 -6 C 34 -2 34 30 58 34 C 82 30 82 -2 58 -6 Z" fill="#ffffff"/>
    <path d="M -58 0 L -58 27 M 58 0 L 58 27" stroke="#0F6B4F" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
    <!-- pillar -->
    <path d="M 0 58 L 0 -34" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="0" cy="60" rx="30" ry="7" fill="#ffffff" opacity="0.9"/>
    <!-- bud -->
    <path d="M 0 -76 C 18 -66 18 -46 0 -38 C -18 -46 -18 -66 0 -76 Z" fill="url(#gold)"/>
    <path d="M 0 -70 L 0 -43" stroke="#0F6B4F" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <!-- sprouts -->
    <path d="M 0 -10 C -18 -16 -26 -8 -28 2 C -16 4 -6 -2 0 -10 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M 0 -10 C 18 -16 26 -8 28 2 C 16 4 6 -2 0 -10 Z" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
