# Database for the integration tests.
#
# The integration tests need a real PostgreSQL server with the production
# schema: the whole class of defects they exist for (SQLite-flavoured SQL,
# column drift, aggregate misuse) only shows up when the statements run on
# the engine that will run them in production.
#
# This container is deliberately throwaway. The data lives in a tmpfs, so it
# disappears with the container, and the schema is rebuilt from the same
# migration files the application uses.
#
#   docker compose -f docker-compose.test.yml up -d
#   npm run test:integration
#
# The port is 55433 so it cannot collide with a PostgreSQL that is already
# running on the host, or with the gate's own database container.
#
#   TEST_DB_PORT=5555 docker compose -f docker-compose.test.yml up -d

---
services:
  test-db:
    image: postgres:16-alpine
    container_name: payroll-test-db
    environment:
      POSTGRES_DB: payroll_test
      POSTGRES_USER: payroll_app
      POSTGRES_PASSWORD: testpass123
      PGSCHEMA: payroll_test
    ports:
      - "${TEST_DB_PORT:-55433}:5432"
    # tmpfs, not a volume: the data has no value, and wiping it between runs
    # is what keeps a test from inheriting the state of an earlier one.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payroll_app -d payroll_test"]
      interval: 3s
      timeout: 5s
      retries: 20
