services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payroll}
      POSTGRES_USER: ${POSTGRES_USER:-payroll_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - payroll-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # The project's own .env is the source of truth for the app's settings, and
    # it is read as a file rather than interpolated. Interpolation lets the
    # shell win over .env, and this machine carries a DATABASE_URL for a
    # different project in the user environment — which would silently point
    # the payroll app at another database. Reading the file cannot be shadowed.
    #
    # The values below are the ones that must differ inside the container.
    # `environment:` takes precedence over `env_file:`, so NODE_ENV is the
    # production build and PORT is the internal one even though .env names the
    # development ones.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - payroll-app-backups:/app/backups
      - payroll-app-uploads:/app/uploads

volumes:
  payroll-postgres-data:
  payroll-app-backups:
  payroll-app-uploads:
