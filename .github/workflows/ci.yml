name: CI

# Gate for the payroll system. Every job here exists because a class of defect
# reached production silently and could not be caught by tsc or unit tests:
#
#   - write-path drift: INSERT naming a column the schema lacks. `SELECT *`
#     resolves no columns, so neither type-checking nor a read-path test sees
#     it. It surfaced only when a user pressed the button (HTTP 500).
#   - read-path drift: a SELECT naming a column or table that does not exist.
#     The schema-drift test resolves every statement against a database built
#     from the migrations, so it runs in CI now (`npm test` builds it first).
#   - dialect drift: a statement written for SQLite that PostgreSQL rejects —
#     `julianday()`, `text <= timestamp`, `MAX(a, b)`, `substr()` on a
#     TIMESTAMPTZ. SQLite accepts all of them, so the SQLite gate cannot see
#     them; the postgres-gate job below plans every statement on a real
#     PostgreSQL server.
#   - unclassified RBAC routes: a write endpoint reachable without a policy.
#   - validation regressions: 21 of 31 schemas used to be double-wrapped and
#     would have rejected every request; a unit test now pins that shape.
#   - environment shape: a DATABASE_URL spread over several lines passes
#     dotenv but is cut at the first newline by `docker run --env-file`.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily health check at 06:00 UTC. Only the `health-check` job reacts to
    # this event; the heavy CI jobs keep their original push/PR behaviour.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      confirm_staging:
        description: 'Confirm the staging verification and placeholder staging step'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Unit + drift tests
        # `npm test` builds the throwaway database from the migrations first,
        # so the schema-drift test has a schema to resolve against and cannot
        # be skipped for want of one.
        run: npm run test

      - name: Schema drift gates
        # Builds a throwaway database from the migrations + the boot-time
        # reconciliation, then fails if any INSERT/UPDATE names a column the
        # schema lacks, or if SQL is interpolated outside the allowlist.
        # payroll.db is git-ignored, so this is the only way these checks have
        # a schema to resolve against on CI.
        run: npm run check:drift

      - name: Environment file shape
        run: npm run check:env

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  postgres-gate:
    # Plans every statement the server sends against a real PostgreSQL server.
    # The dialect defects (SQLite functions and casts PostgreSQL rejects) are
    # invisible to the SQLite gates — they only fail here.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payroll_app
          POSTGRES_PASSWORD: testpass123
          POSTGRES_DB: payroll
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PG_GATE_URL: postgres://payroll_app:testpass123@127.0.0.1:5432/payroll

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Plan every statement on PostgreSQL
        run: npm run check:pg-prepare

  integration:
    # Runs the financial routes against a real PostgreSQL server that holds
    # five hundred employees, twenty-four months of payroll and three months
    # of attendance.
    #
    # The assertions are on numbers, not on status codes: a response of 200
    # with a wrong net salary is a failure that no other gate in this file
    # would catch. The dataset is generated from a fixed seed, so the totals
    # are exact rather than approximate.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payroll_app
          POSTGRES_PASSWORD: testpass123
          POSTGRES_DB: payroll_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write the test environment file
        # The application's .env is authoritative and cannot be overridden
        # from the shell, so the test run names the file it wants instead.
        # There is no .env in the repository, so this is the only one.
        run: |
          mkdir -p scripts/.build
          {
            echo 'PGSCHEMA=payroll_test'
            echo 'DATABASE_URL=postgresql://payroll_app:testpass123@127.0.0.1:5432/payroll_test'
            echo 'PG_POOL_MAX=4'
            echo 'NODE_ENV=test'
            echo 'JWT_SECRET=integration-test-secret-not-used-in-production'
            echo 'CORS_ORIGINS=http://localhost:13000'
          } > scripts/.build/test.env

      - name: Build the test schema
        run: npm run db:test-schema

      - name: Generate the dataset
        run: npm run gen:test-data

      - name: Run the integration tests
        run: npm run test:integration

  ui-smoke:
    # Walks every screen of the built application in a real browser.
    #
    # The other gates see the server and the routes. This one sees the
    # screens: a screen that throws while it renders, a screen that asks for
    # a field the API stopped sending, a screen that shows nothing at all —
    # none of them reach a test that never opens a browser.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payroll_app
          POSTGRES_PASSWORD: testpass123
          POSTGRES_DB: payroll_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Write the test environment file
        run: |
          mkdir -p scripts/.build
          {
            echo 'PGSCHEMA=payroll_test'
            echo 'DATABASE_URL=postgresql://payroll_app:testpass123@127.0.0.1:5432/payroll_test'
            echo 'PG_POOL_MAX=4'
            echo 'NODE_ENV=test'
            echo 'JWT_SECRET=integration-test-secret-not-used-in-production'
            echo 'CORS_ORIGINS=http://localhost:13000'
          } > scripts/.build/test.env

      - name: Build the test schema
        run: npm run db:test-schema

      - name: Generate the dataset
        run: npm run gen:test-data

      - name: Build the application
        run: npm run build

      - name: Walk every screen
        run: npm run ui:smoke

      - name: Upload the screen report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-report
          path: scripts/.build/ui-smoke-report.json
          retention-days: 7

  health-check:
    # Scheduled, low-risk probe. The URL and optional bearer token come only
    # from repository variables/secrets; nothing is hard-coded and curl output
    # is suppressed so no secret or query-string token can reach the log.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
      HEALTHCHECK_TOKEN: ${{ secrets.HEALTHCHECK_TOKEN }}
    steps:
      - name: Safe health check via curl
        run: |
          set -eu
          if [ -z "${HEALTHCHECK_URL:-}" ]; then
            echo "HEALTHCHECK_URL is not configured; skipping health check."
            exit 0
          fi
          # Never pass the token as a literal command-line value and never
          # print the URL or curl stderr (both may contain credentials).
          if [ -n "${HEALTHCHECK_TOKEN:-}" ]; then
            if ! code=$(curl --silent --fail --max-time 10 --output /dev/null --write-out '%{http_code}' -H "Authorization: Bearer ${HEALTHCHECK_TOKEN}" "$HEALTHCHECK_URL" 2>/dev/null); then
              echo "Health check failed; details suppressed to protect secrets."
              exit 1
            fi
          else
            if ! code=$(curl --silent --fail --max-time 10 --output /dev/null --write-out '%{http_code}' "$HEALTHCHECK_URL" 2>/dev/null); then
              echo "Health check failed; details suppressed to protect secrets."
              exit 1
            fi
          fi
          echo "Health check HTTP status: ${code}"

  staging:
    # Manually dispatched only. `npm run verify` always runs; the placeholder
    # staging deployment is additionally gated on the boolean input.
    # Production is never targeted by this workflow.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Placeholder staging deployment (explicit confirmation required)
        if: inputs.confirm_staging
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
          STAGING_TOKEN: ${{ secrets.STAGING_DEPLOY_TOKEN }}
        run: |
          set -eu
          echo "Staging deployment placeholder: confirmation received."
          if [ -z "${STAGING_URL:-}" ]; then
            echo "STAGING_URL is not configured; no deployment performed."
            exit 0
          fi
          echo "Staging target is configured from repository variables; this step is a placeholder only."
          echo "Production is never targeted by this workflow."
